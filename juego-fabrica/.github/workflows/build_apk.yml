name: Build Real APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup Godot
      run: |
        wget -q https://downloads.tuxfamily.org/godotengine/4.2.1/Godot_v4.2.1-stable_linux.x86_64.zip
        unzip Godot_v4.2.1-stable_linux.x86_64.zip
    - name: Export APK
      run: ./Godot_v4.2.1-stable_linux.x86_64 --headless --path . --export-release "Android" ../game.apk
